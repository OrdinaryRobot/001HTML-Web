name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 站点地址的单一来源在这里。
  # 迁移到根域名时，只需改这一行（同时改 hugo.toml 的 baseURL）。
  BASEURL: https://ordinaryrobot.github.io/001HTML-Web/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      # 在 hugo build 之前把仓库根的旧站文件放进 static/legacy。
      # Hugo 会把它连同 static/ 下的其他内容一起产出到 public/legacy/，
      # 流程统一由 Hugo 负责，本地 hugo server 也能直接预览。
      - name: Stage legacy static pages
        run: |
          mkdir -p static/legacy
          find . -maxdepth 1 -type f \( \
            -iname "*.html" -o -iname "*.htm" \
            -o -iname "*.webp" -o -iname "*.png" \
            -o -iname "*.jpg" -o -iname "*.jpeg" \
            -o -iname "*.gif" -o -iname "*.svg" \
            -o -iname "*.css" -o -iname "*.js" \
            \) -exec cp -f {} static/legacy/ \;
          echo "已暂存到 static/legacy 的旧站文件："
          ls -la static/legacy/

      - name: Build
        run: hugo --minify --baseURL "${BASEURL}"

      - name: Verify output
        run: |
          echo "构建产物中的 legacy 文件："
          ls -la public/legacy/ 2>/dev/null || echo "（无旧站文件，属正常）"
          echo ""
          echo "站点首页存在性检查："
          test -f public/index.html && echo "  ✅ public/index.html" || { echo "  ❌ 缺少 public/index.html"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
