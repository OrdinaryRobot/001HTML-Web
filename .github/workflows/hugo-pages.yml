name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        run: hugo --minify --baseURL "https://ordinaryrobot.github.io/001HTML-Web/"

      - name: Copy legacy static pages
        run: |
          mkdir -p public/legacy
          # 把仓库根的旧站 HTML 与常见图片复制进 public/legacy，保证老页面仍可访问
          # 注意：这一步在 hugo build 之后执行，旧站文件的 index.html 会覆盖 Hugo 可能生成的同名文件
          find . -maxdepth 1 -type f \( \
            -iname "*.html" -o -iname "*.htm" \
            -o -iname "*.webp" -o -iname "*.png" \
            -o -iname "*.jpg" -o -iname "*.jpeg" \
            -o -iname "*.gif" -o -iname "*.svg" \
            -o -iname "*.css" -o -iname "*.js" \
            \) -exec cp -f {} public/legacy/ \;
          echo "已复制到 public/legacy 的文件："
          ls -la public/legacy/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
