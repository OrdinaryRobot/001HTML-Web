{{- /* 列表页增强：相对时间 + 阅读/评论数拉取（仅文章列表卡片页，文章页不注入） */ -}}
{{- if and (eq .Section "posts") (eq .Kind "section") }}
<script>
(function () {
  var box = document.getElementById('post-cards');
  if (!box) return;

  /* ---------- 1. 把绝对时间换成相对时间 ---------- */
  function relTime(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return null;
    var d = Date.now() - t;
    if (d < 0) d = 0;
    var MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
    if (d < MIN) return '刚刚';
    if (d < HOUR) return Math.floor(d / MIN) + ' 分钟前';
    if (d < DAY) return Math.floor(d / HOUR) + ' 小时前';
    if (d < 30 * DAY) return Math.floor(d / DAY) + ' 天前';
    if (d < 365 * DAY) return Math.floor(d / (30 * DAY)) + ' 个月前';
    return Math.floor(d / (365 * DAY)) + ' 年前';
  }

  var times = box.querySelectorAll('time.pc-reltime');
  for (var i = 0; i < times.length; i++) {
    var r = relTime(times[i].getAttribute('datetime'));
    if (r) times[i].textContent = r;
  }

  /* ---------- 2. 通过隐藏 iframe 拉阅读数 / 评论数 ---------- */
  var api = box.getAttribute('data-api');
  if (!api) return;

  var apiOrigin;
  try { apiOrigin = new URL(api, location.href).origin; } catch (e) { return; }

  /* 先挂监听器，再创建 iframe —— 否则统计页可能比监听器先就绪 */
  window.addEventListener('message', function (e) {
    if (e.origin !== apiOrigin) return;
    var d = e.data;
    if (!d || d.type !== 'wb-stats') return;
    var stats = d.data || {};

    function fill(sel, key) {
      var els = box.querySelectorAll(sel);
      for (var j = 0; j < els.length; j++) {
        var p = els[j].getAttribute('data-path');
        var rec = stats[p];
        var v = rec ? rec[key] : null;
        els[j].textContent = (typeof v === 'number') ? v : '0';
      }
    }
    fill('.pc-views', 'views');
    fill('.pc-comments', 'comments');
  }, false);

  var frame = document.createElement('iframe');
  frame.setAttribute('aria-hidden', 'true');
  frame.setAttribute('title', 'stats');
  frame.setAttribute('scrolling', 'no');
  frame.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px;border:0;opacity:0;pointer-events:none;';
  frame.src = api + '?paths=' + encodeURIComponent(box.getAttribute('data-paths') || '');
  document.body.appendChild(frame);
})();
</script>
{{- end }}
